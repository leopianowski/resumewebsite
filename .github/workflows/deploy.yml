name: Deploy

# Roda o build.py e publica o dist/ no GitHub Pages.
# Nada gerado é versionado — o site é sempre construído a partir de data.py.
#
# Pré-requisito, uma vez só: no GitHub, Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite disparar na mão pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Se dois pushes chegarem juntos, o mais novo ganha.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        # `shell: bash` é necessário: ele liga `-o pipefail`, que o shell padrão
        # do Actions não tem. Sem isso, num `python ... | tee`, um crash do
        # build.py seria mascarado pelo exit 0 do tee e o job passaria.
        shell: bash
        run: python build.py | tee build.log

      - name: Bloquear deploy se faltar a foto de perfil
        # Melhor quebrar aqui do que publicar um <img> quebrado. Logo de empresa
        # faltando é só aviso — o placeholder com as iniciais cobre.
        run: |
          if grep -q 'ATENÇÃO' build.log; then
            echo "::error::foto de perfil faltando em static/img/ — deploy bloqueado"
            exit 1
          fi

      - name: Conferir que o dist saiu íntegro
        # Rede de segurança contra artefato vazio ou pela metade.
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html não existe"; exit 1; }
          test -f dist/css/style.css || { echo "::error::CSS não foi copiado"; exit 1; }
          test -f dist/.nojekyll || { echo "::error::.nojekyll não foi escrito"; exit 1; }
          echo "dist/ com $(find dist -type f | wc -l) arquivos"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
